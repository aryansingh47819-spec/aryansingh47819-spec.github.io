<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aryan Control Panel</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#020617;
  color:#facc15;
}
.container{
  max-width:95%;
  margin:20px auto;
  background:#020617;
  padding:15px;
  border-radius:10px;
  box-shadow:0 0 15px #facc15;
}
h2,h3{
  text-align:center;
}
input,button,textarea{
  width:100%;
  margin-top:10px;
  padding:10px;
  border-radius:6px;
  font-size:15px;
}
input,textarea{
  background:#020617;
  color:#facc15;
  border:1px solid #facc15;
}
textarea{
  min-height:200px;
  font-family: monospace;
}
button{
  background:#facc15;
  color:black;
  font-weight:bold;
  cursor:pointer;
}
button:hover{background:#fde047;}
.hidden{display:none;}
.sectionBtn{margin-top:12px;}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="container" id="loginBox">
<h2>Owner Login</h2>
<input type="password" id="loginPass" placeholder="Enter Password">
<button onclick="login()">Login</button>
</div>

<!-- PANEL -->
<div class="container hidden" id="panel">
<h2>Aryan Arduino | Robotics | IoT</h2>

<button class="sectionBtn" onclick="openSection('arduino')">Arduino</button>
<button class="sectionBtn" onclick="openSection('robotics')">Robotics</button>
<button class="sectionBtn" onclick="openSection('iot')">IoT</button>

<!-- ARDUINO -->
<div id="arduino" class="hidden">
<h3>Arduino Code</h3>
<textarea id="arduinoCode" placeholder="Paste Arduino code here"></textarea>
<button onclick="saveCode('arduinoCode')">Save</button>
</div>

<!-- ROBOTICS -->
<div id="robotics" class="hidden">
<h3>Robotics Code</h3>
<textarea id="roboticsCode" placeholder="Paste Robotics code here"></textarea>
<button onclick="saveCode('roboticsCode')">Save</button>
</div>

<!-- IOT -->
<div id="iot" class="hidden">
<h3>IoT Code</h3>
<textarea id="iotCode" placeholder="Paste IoT code here"></textarea>
<button onclick="saveCode('iotCode')">Save</button>
</div>

<hr>

<h3>Change Password</h3>
<input type="password" id="newPass" placeholder="New Password">
<button onclick="changePassword()">Update Password</button>

<button style="background:red;color:white;margin-top:15px" onclick="logout()">Logout</button>
</div>

<script>
// PASSWORD MEMORY
if(!localStorage.getItem("ownerPass")){
  localStorage.setItem("ownerPass","aryanSingh(8");
}

// LOGIN
function login(){
  let p=document.getElementById("loginPass").value;
  if(p===localStorage.getItem("ownerPass")){
    loginBox.classList.add("hidden");
    panel.classList.remove("hidden");
    loadCodes();
  }else alert("Wrong Password");
}

// OPEN SECTION
function openSection(id){
  ["arduino","robotics","iot"].forEach(s=>{
    document.getElementById(s).classList.add("hidden");
  });
  document.getElementById(id).classList.remove("hidden");
}

// SAVE CODE
function saveCode(id){
  localStorage.setItem(id,document.getElementById(id).value);
  alert("Code Saved");
}

// LOAD MEMORY
function loadCodes(){
  ["arduinoCode","roboticsCode","iotCode"].forEach(id=>{
    document.getElementById(id).value = localStorage.getItem(id)||"";
  });
}

// CHANGE PASSWORD
function changePassword(){
  let n=document.getElementById("newPass").value;
  if(n.length<4){alert("Password too short");return;}
  localStorage.setItem("ownerPass",n);
  alert("Password Updated");
}

// LOGOUT
function logout(){location.reload();}
</script>

</body>
</html>
