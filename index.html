<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aryan Robotics & IoT Codes</title>

<style>
body{
  margin:0;
  font-family:system-ui,Arial;
  background:#020617;
  color:#e5e7eb;
}
header{
  text-align:center;
  padding:20px;
}
header img{
  width:120px;
}
h1{
  color:#facc15;
  margin:10px 0;
}
.container{
  max-width:1000px;
  margin:auto;
  padding:15px;
}
.box{
  background:#020617;
  border:1px solid #facc15;
  border-radius:14px;
  padding:20px;
  margin-bottom:20px;
}
button{
  width:100%;
  padding:12px;
  margin:8px 0;
  font-weight:700;
  border:none;
  border-radius:10px;
  background:#facc15;
  color:#000;
  cursor:pointer;
}
input{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid #facc15;
  background:#020617;
  color:#facc15;
  margin-bottom:10px;
}
.code{
  background:#000;
  border:1px solid #facc15;
  padding:15px;
  border-radius:10px;
  white-space:pre-wrap;
  font-family:monospace;
  color:#facc15;
}
footer{
  text-align:center;
  padding:20px;
  color:#94a3b8;
  font-size:14px;
}
a{color:#facc15;text-decoration:none}
</style>
</head>

<body>

<header>
  <img src="dino.png" alt="Dino">
  <h1>Aryan Arduino • Robotics • IoT</h1>
</header>

<div class="container">

<!-- GOOGLE SEARCH -->
<div class="box">
  <form action="https://www.google.com/search" method="get" target="_blank">
    <input name="q" placeholder="🌍 Google Search anything..." required>
    <button type="submit">Search on Google</button>
  </form>
</div>

<!-- SITE SEARCH -->
<div class="box">
  <input id="search" placeholder="🔍 Search project here..." onkeyup="filterCode()">
</div>

<!-- CATEGORY -->
<div class="box">
  <button onclick="show('arduino')">Arduino Codes</button>
  <button onclick="show('robotics')">Robotics Codes</button>
  <button onclick="show('iot')">IoT Codes</button>
</div>

<!-- CONTENT -->
<div class="box" id="content">
  <h3>Select category</h3>
</div>

</div>

<footer>
Made by <b>Aryan Singh</b> | Help of Python • JavaScript • Termux
</footer>

<script>
const data = {
arduino:[
{
title:"Fire Alarm System",
code:`// FIRE ALARM SYSTEM
int flame=2;
int buzzer=8;
void setup(){
 pinMode(flame,INPUT);
 pinMode(buzzer,OUTPUT);
}
void loop(){
 if(digitalRead(flame)==LOW)
  digitalWrite(buzzer,HIGH);
 else
  digitalWrite(buzzer,LOW);
}`
}
],

robotics:[
{
title:"Smart Blind Stick",
code:`// SMART BLIND STICK
int trig=2, echo=3, buzzer=8;
long d; int dist;
void setup(){
 pinMode(trig,OUTPUT);
 pinMode(echo,INPUT);
 pinMode(buzzer,OUTPUT);
}
void loop(){
 digitalWrite(trig,LOW); delayMicroseconds(2);
 digitalWrite(trig,HIGH); delayMicroseconds(10);
 digitalWrite(trig,LOW);
 d=pulseIn(echo,HIGH);
 dist=d*0.034/2;
 if(dist>0 && dist<30)
  digitalWrite(buzzer,HIGH);
 else
  digitalWrite(buzzer,LOW);
}`
}
],

iot:[
{
title:"Smart Gas Leakage",
code:`// GAS LEAKAGE DETECTION
int gas=A0;
int buzzer=9;
void setup(){
 pinMode(buzzer,OUTPUT);
}
void loop(){
 if(analogRead(gas)>400)
  digitalWrite(buzzer,HIGH);
 else
  digitalWrite(buzzer,LOW);
}`
}
]
};

function show(cat){
 const c=document.getElementById("content");
 c.innerHTML="";
 data[cat].forEach(x=>{
  c.innerHTML+=`<h3>${x.title}</h3><div class="code">${x.code}</div>`;
 });
}

function filterCode(){
 let q=document.getElementById("search").value.toLowerCase();
 const c=document.getElementById("content");
 c.innerHTML="";
 Object.values(data).flat().forEach(x=>{
  if(x.title.toLowerCase().includes(q)){
   c.innerHTML+=`<h3>${x.title}</h3><div class="code">${x.code}</div>`;
  }
 });
}
</script>

</body>
</html>
