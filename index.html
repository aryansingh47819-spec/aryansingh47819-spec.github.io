<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aryan Arduino • Robotics • IoT</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#020617;
  color:#facc15;
}
header{
  padding:15px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
  background:#020617;
  box-shadow:0 0 10px #facc15;
}
nav{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:15px;
}
nav button{
  padding:10px 16px;
  background:#facc15;
  color:black;
  border:none;
  border-radius:6px;
  font-weight:bold;
  cursor:pointer;
}
nav button:hover{background:#fde047;}

.section{display:none; padding:15px;}
.section.active{display:block;}

.code-item{
  border:1px solid #facc15;
  border-radius:8px;
  padding:10px;
  margin-bottom:12px;
  cursor:pointer;
}
.code-item:hover{background:#020617;}
pre{
  display:none;
  background:#020617;
  padding:10px;
  overflow:auto;
  color:#fde047;
}

.owner-box{
  margin:20px auto;
  max-width:400px;
  border:1px solid #facc15;
  padding:15px;
  border-radius:8px;
}
input, textarea{
  width:100%;
  margin-top:8px;
  padding:8px;
  background:#020617;
  color:#facc15;
  border:1px solid #facc15;
  border-radius:5px;
}
textarea{min-height:100px;}
.owner-only{display:none;}
button.action{
  margin-top:10px;
  width:100%;
  background:#facc15;
  color:black;
  padding:10px;
  border:none;
  border-radius:5px;
  font-weight:bold;
  cursor:pointer;
}
button.red{background:#ef4444;color:white;}
</style>
</head>

<body>

<header>
Aryan Singh – Arduino | Robotics | IoT
</header>

<nav>
  <button onclick="openSection('arduino')">Arduino</button>
  <button onclick="openSection('robotics')">Robotics</button>
  <button onclick="openSection('iot')">IoT</button>
  <button onclick="toggleOwner()">Owner Login</button>
</nav>

<!-- ARDUINO -->
<div id="arduino" class="section active"></div>

<!-- ROBOTICS -->
<div id="robotics" class="section"></div>

<!-- IOT -->
<div id="iot" class="section"></div>

<!-- OWNER PANEL -->
<div class="owner-box" id="ownerBox" style="display:none;">
  <h3>Owner Control Panel</h3>
  <input type="password" id="ownerPass" placeholder="Owner Password">
  <button class="action" onclick="loginOwner()">Login</button>

  <div id="ownerPanel" class="owner-only">
    <select id="category">
      <option value="arduino">Arduino</option>
      <option value="robotics">Robotics</option>
      <option value="iot">IoT</option>
    </select>
    <input id="codeTitle" placeholder="Code Title">
    <textarea id="codeData" placeholder="Paste Code Here"></textarea>
    <button class="action" onclick="addCode()">Add Code</button>

    <input id="newPass" placeholder="New Password">
    <button class="action" onclick="changePassword()">Change Password</button>

    <button class="action red" onclick="logout()">Logout</button>
  </div>
</div>

<script>
/* ===== PASSWORD MEMORY ===== */
if(!localStorage.getItem("ownerPassword")){
  localStorage.setItem("ownerPassword","aryanSingh(8");
}

/* ===== DATA MEMORY ===== */
let data = JSON.parse(localStorage.getItem("siteData")) || {
  arduino:[],
  robotics:[],
  iot:[]
};

function saveData(){
  localStorage.setItem("siteData",JSON.stringify(data));
}

/* ===== UI ===== */
function openSection(id){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function toggleOwner(){
  let box=document.getElementById("ownerBox");
  box.style.display = box.style.display==="none"?"block":"none";
}

/* ===== OWNER ===== */
function loginOwner(){
  let p=document.getElementById("ownerPass").value;
  if(p===localStorage.getItem("ownerPassword")){
    document.querySelectorAll(".owner-only").forEach(e=>e.style.display="block");
    alert("Owner Login Success");
  }else alert("Wrong Password");
}

function logout(){
  document.querySelectorAll(".owner-only").forEach(e=>e.style.display="none");
}

function changePassword(){
  let np=document.getElementById("newPass").value;
  if(np.length<4){alert("Password too short");return;}
  localStorage.setItem("ownerPassword",np);
  alert("Password Changed");
}

/* ===== CODE SYSTEM ===== */
function addCode(){
  let cat=document.getElementById("category").value;
  let title=document.getElementById("codeTitle").value;
  let code=document.getElementById("codeData").value;
  if(!title||!code){alert("Fill all fields");return;}
  data[cat].push({title,code});
  saveData();
  render();
  document.getElementById("codeTitle").value="";
  document.getElementById("codeData").value="";
}

function render(){
  ["arduino","robotics","iot"].forEach(cat=>{
    let box=document.getElementById(cat);
    box.innerHTML="";
    data[cat].forEach(item=>{
      let div=document.createElement("div");
      div.className="code-item";
      div.innerHTML=item.title+"<pre>"+item.code+"</pre>";
      div.onclick=()=> {
        let p=div.querySelector("pre");
        p.style.display=p.style.display==="block"?"none":"block";
      };
      box.appendChild(div);
    });
  });
}
render();
</script>

</body>
</html>
