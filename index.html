<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aryan Codes Hub</title>

<style>
:root{
  --bg:#0f172a;
  --card:#020617;
  --accent:#facc15;
  --text:#e5e7eb;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,Arial;
  background:linear-gradient(135deg,#020617,#0f172a);
  color:var(--text);
}

header{
  text-align:center;
  padding:25px;
  font-size:28px;
  font-weight:700;
  color:var(--accent);
}

.container{
  max-width:1000px;
  margin:auto;
  padding:15px;
}

.card{
  background:var(--card);
  border-radius:14px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 0 20px rgba(250,204,21,.25);
}

button{
  background:var(--accent);
  color:#000;
  border:none;
  padding:12px 18px;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
  margin:5px;
}

button:hover{opacity:.9}

.hidden{display:none}

input,textarea{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid var(--accent);
  background:#020617;
  color:var(--accent);
  font-size:15px;
}

textarea{
  min-height:160px;
  font-family:monospace;
}

select{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid var(--accent);
  background:#020617;
  color:var(--accent);
}

.section-btns button{
  width:100%;
  margin-top:10px;
}

.code-box{
  background:#020617;
  border:1px solid var(--accent);
  border-radius:10px;
  padding:12px;
  margin-top:12px;
  white-space:pre-wrap;
  font-family:monospace;
  color:#facc15;
}

footer{
  text-align:center;
  padding:20px;
  color:#94a3b8;
  font-size:14px;
}
</style>
</head>

<body>

<header>🚀 Aryan Arduino • Robotics • IoT Codes</header>

<div class="container">

<!-- 🔐 OWNER LOGIN -->
<div class="card" id="loginBox">
  <h2>Owner Login</h2>
  <input type="password" id="loginPass" placeholder="Enter Owner Password">
  <button onclick="login()">Login</button>
</div>

<!-- 👑 OWNER PANEL -->
<div class="card hidden" id="ownerPanel">
  <h2>Owner Control Panel</h2>

  <input id="codeTitle" placeholder="Project / Code Name">
  <textarea id="codeData" placeholder="Paste Arduino code here"></textarea>

  <select id="category">
    <option value="arduino">Arduino</option>
    <option value="robotics">Robotics</option>
    <option value="iot">IoT</option>
  </select>

  <button onclick="addCode()">Upload Code</button>
  <button onclick="logout()" style="background:red;color:white">Logout</button>
</div>

<!-- 🔍 SEARCH BAR (NEW – ADDED ONLY) -->
<div class="card">
  <input id="searchBox" placeholder="🔍 Search code by name..." oninput="searchCode()">
</div>

<!-- 📂 CATEGORY BUTTONS -->
<div class="card">
  <div class="section-btns">
    <button onclick="show('arduino')">Arduino</button>
    <button onclick="show('robotics')">Robotics</button>
    <button onclick="show('iot')">IoT</button>
  </div>
</div>

<!-- 📄 CONTENT -->
<div class="card" id="content">
  <h3>Select a category to view codes</h3>
</div>

</div>

<footer>
Made by <b>Aryan Singh</b> | Help of Python • JavaScript • Termux
</footer>

<script>
/* 🔐 PASSWORD MEMORY */
if(!localStorage.getItem("ownerPass")){
  localStorage.setItem("ownerPass","aryansingh(8928)");
}

function login(){
  if(loginPass.value === localStorage.getItem("ownerPass")){
    loginBox.classList.add("hidden");
    ownerPanel.classList.remove("hidden");
  }else alert("Wrong password");
}

function logout(){location.reload()}

function getData(){
  return JSON.parse(localStorage.getItem("codes")||'{"arduino":[],"robotics":[],"iot":[]}');
}

function saveData(d){
  localStorage.setItem("codes",JSON.stringify(d));
}

function addCode(){
  if(!codeTitle.value || !codeData.value){
    alert("Title & Code required");
    return;
  }
  let d=getData();
  d[category.value].push({t:codeTitle.value,c:codeData.value});
  saveData(d);
  codeTitle.value=codeData.value="";
  alert("Code Uploaded Successfully");
}

function show(cat){
  let d=getData();
  content.innerHTML=`<h2>${cat.toUpperCase()} PROJECTS</h2>`;
  d[cat].forEach(x=>{
    content.innerHTML+=`
      <h3>${x.t}</h3>
      <div class="code-box">${x.c}</div>
    `;
  });
}

function searchCode(){
  let q = searchBox.value.toLowerCase();
  let d = getData();
  content.innerHTML="<h2>Search Results</h2>";
  ["arduino","robotics","iot"].forEach(cat=>{
    d[cat].forEach(x=>{
      if(x.t.toLowerCase().includes(q)){
        content.innerHTML+=`
          <h3>${x.t} <small>(${cat})</small></h3>
          <div class="code-box">${x.c}</div>
        `;
      }
    });
  });
}
</script>

</body>
</html>
